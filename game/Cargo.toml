[package]
name = "game"
version = "0.1.0"
edition = "2021"

[dependencies]
ggez = "0.9.3"
rand = "0.8.5"
warp = "0.3"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12.9", features = ["blocking", "json"] }
uuid = { version = "1.11.0", features = ["v4"] }
# Only the training experiments in dqn_linear_agent.rs used this. The shipped
# client never calls them, and building a GPU ML framework into it costs
# minutes and ~20 MB. Put it back if you switch that module on again.
# burn = { version = "0.15.0", features = ["wgpu", "train", "dataset"] }
